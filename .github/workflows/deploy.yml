name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets this be re-run manually from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploy previously ran independently of the Checks workflow (both just
      # trigger on push to main), so a commit that failed checks.yml could
      # still deploy live — these two steps make this workflow fail closed
      # instead of relying on Checks alone.
      - name: Check JS syntax
        run: |
          status=0
          for f in $(find js -name '*.js') sw.js; do
            echo "Checking $f"
            node --check "$f" || status=1
          done
          exit $status

      - name: Build site (Eleventy)
        run: npm run build

      - name: Check links, manifest, JSON-LD, sitemap
        run: python3 scripts/check_site.py

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
